name: CI

# A Vercel publica o site (news.nico.dev.br) a cada push em main.
# Este workflow só garante que o JSON e o build estão corretos.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
